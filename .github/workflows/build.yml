name: 'Build'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmake;3.22.1 ndk;26.1.10909125'

      - name: 'Build and Test Monorepo'
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :pc-engine:test :pc-engine:shadowJar :pc-shell:test :android:assembleDebug

      - name: 'Upload PC Engine JAR'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'hfx-engine-jar'
          path: 'pc-engine/build/libs/hfx-engine-*.jar'

      - name: 'Upload Debug APK'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'debug-apk'
          path: 'HybridFileXfer-Android/app/build/outputs/apk/debug/*.apk'
